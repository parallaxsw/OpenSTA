name: GitHub Pages

# Publishes MkDocs (mkdocs.yml) to the gh-pages branch on every push to master.
# Enable Pages: Settings → Pages → Deploy from a branch → gh-pages / (root).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            flex libfl-dev bison swig tcl-dev libeigen3-dev ninja-build wget

      - name: Build sta and generate command docs
        run: bash etc/build_sta.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r doc/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
